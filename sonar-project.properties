# ===== Analyse SAST SonarQube — juice-shop =====
sonar.projectKey=juice-shop
sonar.projectName=juice-shop
sonar.projectVersion=20.3.0

# Code analysé
sonar.sources=.
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclusions : dépendances, fichiers générés, données de challenge, rapports
sonar.exclusions=.trivycache/**,**/node_modules/**,frontend/dist/**,frontend/.angular/**,build/**,dist/**,\
  test/**,**/*.spec.ts,data/static/**,ftp/**,encryptionkeys/**,monitoring/**,\
  vagrant/**,screenshots/**,.sonar/**,**/*.min.js,bom.json,\
  gitleaks-report.json,.gitleaks-baseline.json,trivy-sca-report.json,\
  trivy-image-report.json,zap-report.html,zap-report.json,zap-rules.conf

# Analyse TypeScript d'un gros projet : plus de mémoire pour l'analyseur
sonar.javascript.node.maxspace=4096
