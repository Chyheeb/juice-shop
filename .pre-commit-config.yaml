# Contrôles shift-left exécutés sur le poste du développeur, avant chaque commit.
# Ils ne s'appliquent qu'aux fichiers modifiés (approche "new code").
repos:
  # Détection de secrets (tokens, clés API, mots de passe)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Contrôles génériques
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key          # clés privées (RSA, SSH...)
        # Exception documentée : clé factice du challenge Juice Shop "iacLeakedKeyChallenge"
        # (marqueur vuln-code-snippet, déjà dans .gitleaks-baseline.json). Toute autre clé reste bloquée.
        exclude: ^(infrastructure/)?terraform/networking\.tf$
      - id: check-added-large-files     # fichiers volumineux (> 500 Ko)
        args: ['--maxkb=500']
      - id: check-merge-conflict        # marqueurs de conflit oubliés
  # SAST : analyse statique des fichiers modifiés (JS/TS)
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.184.0
    hooks:
      - id: semgrep
        args: ['--config', 'p/javascript', '--config', 'p/typescript', '--baseline-commit', 'HEAD',
               '--error', '--skip-unknown-extensions', '--metrics', 'off']
